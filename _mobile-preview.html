<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Workbench responsive preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      gap: 28px;
      padding: 24px;
      background: #1a1a20;
      font-family: system-ui, sans-serif;
      color: #aaa;
    }
    figure { margin: 0; }
    figcaption { margin-bottom: 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    iframe { display: block; border: 1px solid #3a3a44; border-radius: 14px; background: #09090d; }
  </style>
</head>
<body>
  <figure>
    <figcaption>Phone — 390 × 844</figcaption>
    <iframe src="/#home" width="390" height="844" title="Phone layout"></iframe>
  </figure>
  <figure>
    <figcaption>Tablet — 820 × 844</figcaption>
    <iframe src="/#projects" width="820" height="844" title="Tablet layout"></iframe>
  </figure>
</body>
</html>
